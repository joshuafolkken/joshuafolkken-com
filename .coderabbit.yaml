# CodeRabbit 設定ファイル
# https://docs.coderabbit.ai/reference/configuration
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: 'ja'
early_access: false

reviews:
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  poem: true
  review_status: true
  review_details: false
  auto_review:
    enabled: true
    drafts: false
auto_review:
  enabled: true
  drafts: false
  auto_incremental_review: true
  path_instructions:
    - path: 'src/**'
      instructions: |
        SvelteKit プロジェクトです。Svelte 5 の runes ($state, $derived など) と TypeScript の型安全性を重視してください。
        ESLint と Prettier のルールに従っているか確認してください。
    - path: '**/*.spec.*'
      instructions: |
        Vitest のユニットテストです。テストカバレッジとエッジケースの検証を確認してください。
    - path: '**/*.test.*'
      instructions: |
        Playwright の E2E テストです。ユーザーフローとアクセシビリティを確認してください。
    - path: 'scripts/**'
      instructions: |
        ビルド・デプロイ用スクリプトです。エラーハンドリングとクロスプラットフォーム互換性を確認してください。

chat:
  auto_reply: true
