allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
  workerd: true
  better-sqlite3: true
  '@joshuafolkken/kit': false # project postinstall handles lefthook install
  '@joshuafolkken/app-kit': false # consumer does not run app-kit's own preinstall (safe-chain setup-ci)
  '@google/genai': false # REST client (`pnpm yt:article`); no native build needed
  protobufjs: false # pulled in by @google/genai; prebuilt JS, postinstall not required

# Security fixes often require same-day vite releases; minimum-release-age in .npmrc would block them.
# `@types/node` and `tsx` are also excluded so routine Dependabot-style bumps are not
# delayed by the minimum-release-age window.
minimumReleaseAgeExclude:
  - '@joshuafolkken/app-kit'
  - '@joshuafolkken/kit'
  - vite
  - '@sveltejs/vite-plugin-svelte'
  - '@types/node'
  - tsx

overrides:
  esbuild: '^0.25.0'
  cookie: '^0.7.0'
  svelte: ^5.55.7
  devalue: ^5.8.1
  # TypeScript 7.x is the native (Go) port: `require('typescript')` returns a stub with no
  # SyntaxKind, which crashes the type-aware ESLint stack (eslint-plugin-sonarjs, ts-api-utils,
  # typescript-eslint). Pin every resolution to 6.x until that ecosystem supports TS7-native.
  # `josh latest` bumps the typescript devDependency to 7.x, so this override is what actually
  # holds the toolchain on 6.x (the direct devDependency alone does not constrain transitives).
  # Tracking: https://github.com/joshuafolkken/kit/issues/658 — remove once kit gates TS7.
  typescript: '^6.0.3'

trustLockfile: true
