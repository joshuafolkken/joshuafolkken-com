allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
  workerd: true
  better-sqlite3: true
  '@joshuafolkken/kit': false # project postinstall handles lefthook install
  '@joshuafolkken/app-kit': false # consumer does not run app-kit's own preinstall (safe-chain setup-ci)
  '@google/genai': false # REST client (`pnpm yt:article`); no native build needed
  protobufjs: false # pulled in by @google/genai; prebuilt JS, postinstall not required

# Security fixes often require same-day vite releases; minimum-release-age in .npmrc would block them.
# `@types/node` and `tsx` are also excluded so routine Dependabot-style bumps are not
# delayed by the minimum-release-age window.
minimumReleaseAgeExclude:
  - '@joshuafolkken/app-kit'
  - '@joshuafolkken/kit'
  - vite
  - '@sveltejs/vite-plugin-svelte'
  - '@types/node'
  - tsx

overrides:
  esbuild: '^0.25.0'
  cookie: '^0.7.0'
  svelte: ^5.55.7
  devalue: ^5.8.1

trustLockfile: true
