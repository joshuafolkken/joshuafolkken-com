allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
  workerd: true
  better-sqlite3: true
  '@joshuafolkken/kit': false # project postinstall handles lefthook install

# Security fixes often require same-day vite releases; minimum-release-age in .npmrc would block them.
minimumReleaseAgeExclude:
  - vite
  - '@joshuafolkken/kit'
  - '@sveltejs/vite-plugin-svelte'

overrides:
  esbuild: '^0.25.0'
  cookie: '^0.7.0'
  svelte: ^5.55.7
  devalue: ^5.8.1
