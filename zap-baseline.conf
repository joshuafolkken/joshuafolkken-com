# OWASP ZAP baseline rule configuration, read by `josh-app dast`.
#
# Seeded by @joshuafolkken/app-kit. The Tier-1 rules below are app-kit-owned: `josh-app sync`
# inserts any that are missing (insert-if-absent, never overwriting a line you already have), so a
# stack-universal finding stays triaged once here instead of re-derived in every consumer. Every
# other line — your own reasons, the Tier-2 rules you uncomment, and any Tier-3 rule you add — is
# yours; sync never rewrites it.
#
# Format: one tab-separated rule per line.
#   <rule-id>	<IGNORE|WARN|FAIL>	(<reason>)
#
# Every rule defaults to WARN, and zap-baseline.py exits non-zero when anything is reported, so
# an untriaged finding fails the scan. Silence one only with a recorded reason — an IGNORE with
# no justification is indistinguishable from an unnoticed vulnerability six months later.
#
# Rule ids are printed in the scan output (e.g. `WARN-NEW: Content Security Policy (CSP) Header
# Not Set [10038]`). The full list: https://www.zaproxy.org/docs/alerts/
#
# Three tiers classify every finding:
#   Tier 1 — universal: fires for any SvelteKit + Cloudflare-adapter app. Shipped active below and
#            merged into your file on every sync.
#   Tier 2 — conditional-common: fires only when you make a common choice (add a third-party tag).
#            Shipped commented-out; uncomment the one you opted into.
#   Tier 3 — instance-unique: fires from your own content (e.g. a false positive on a bundled SVG).
#            Not shipped by app-kit — add these yourself, below the Tier-2 block.
#
# A rule id already present here is skipped by sync, whatever its reason says, so upstream wording
# can never correct a stale local reason. Every Tier-1 reason below was therefore compared against
# app-kit's shipped text by hand (#798). Where this site genuinely differs, the reason keeps
# upstream's wording and adds a clause marked "Site-specific:" saying why — so the divergence is
# visible rather than silent, and can be dropped when upstream catches up.
#
# --- Tier 1 — universal baseline (app-kit-owned; kept in sync) ------------------------------------
#
# 10038 (CSP not set) is NOT listed: kit.csp in svelte.config.js emits a Content-Security-Policy
# header (nonce-based script-src) on SSR pages, so the finding no longer fires.

10055	IGNORE	(Only the "style-src 'unsafe-inline'" sub-alert is accepted — SvelteKit needs it for runtime-injected transition styles and app.html's inline body wrapper. Inline style cannot run JS, so the script surfaces stay locked down (broaden them only as the documented script-src exception). Note the acceptance cannot be swapped for a style nonce: once a nonce is present CSP3 browsers ignore 'unsafe-inline' entirely, which breaks the very transitions it is here for. Site-specific: script-src is not bare 'self' — it allowlists the Google tag and ads origins and carries a per-request nonce (#790) — and script-src-attr is deliberately left unset so it inherits that same nonce check (#799).)
10049	IGNORE	(Cacheable content is intentional — /_app/immutable/* is content-hashed and served with a one-year immutable Cache-Control by the SvelteKit Cloudflare adapter, and no user-specific data is served from these paths. Site-specific: the scan reports this on HTML pages and on /robots.txt ("Storable but Non-Cacheable Content") as well, not only on /_app/immutable/*; those are public unauthenticated documents with nothing to protect from a cache.)
10109	IGNORE	(Informational, not a vulnerability — ZAP's ModernAppDetectionScanRule reports only that the target looks client-rendered, having found links with target="_self" (SvelteKit emits these), and advises exploring it with the Client Spider. NOT a missing-resource finding: it fires on HTML pages regardless of whether /robots.txt and /sitemap.xml exist, so adding those does not clear it.)
90004	IGNORE	(Rule 90004 groups three sub-alerts and each is assessed separately; COOP is NOT among the ignored ones — Cross-Origin-Opener-Policy: same-origin ships on SSR pages via src/lib/server/security.ts and on static responses via _headers (#803), so its sub-alert no longer fires and this IGNORE covers only the two that remain. COEP: require-corp would break the cross-origin embeds this site depends on — YouTube nocookie, AdSense, OpenCollective images, Google Fonts — which do not all send CORP/CORS headers, and cross-origin isolation (e.g. SharedArrayBuffer) is unused, so there is no benefit to trade for that breakage — revisit if cross-origin isolation is ever required. CORP: declined deliberately (#803), not by omission — it constrains only who may embed this site's own public assets, nothing here needs that restriction, and no user-specific resource is served from the flagged paths; adopt it if an asset-embedding concern ever appears.)

# 10055 script-src widening (special case of Tier 2): the rule above accepts style-src only. If you
# add INLINE third-party script (e.g. inline Google Tag Manager), 10055 also fires its "script-src
# 'unsafe-inline'" sub-alert. Prefer the secure default: keep kit.csp's per-request nonce and load
# the tag via that nonce, leaving script-src ['self']. Broaden 10055 to accept script-src
# 'unsafe-inline' ONLY if an inline script is genuinely unavoidable — it weakens the CSP for every
# page, so it is a deliberate, documented exception, never a frictionless escape hatch.
#
# This site took the secure default: the inline Google tag bootstrap in app.html carries the nonce
# (#790), so the script-src sub-alert does not fire and 10055 is not broadened.
#
# --- Tier 2 — conditional-common (uncomment only the choice you made) -----------------------------
#
# 90003 (Sub-Resource Integrity): fires when you load a third-party CDN script without an
# `integrity="sha384-..."` attribute (e.g. Google Tag Manager, AdSense). Prefer adding the SRI hash;
# uncomment below only if the provider rotates the file and pinning an SRI hash is impractical.
90003	IGNORE	(Opted in. Third-party scripts — Google Tag Manager, AdSense, Google Fonts — load from CDNs that rotate content without stable hashes, so integrity attributes would break on every upstream update; first-party assets are same-origin and served immutable. Revisit if a stably-hashed external dependency is added.)
#
# 10017 (Cross-Domain JavaScript Source File Inclusion): fires when you include JS from another
# origin — expected once you add a third-party tag. Uncomment if that inclusion is intentional.
10017	IGNORE	(Opted in. Cross-domain JS inclusion is intentional: Google Tag Manager and AdSense load from Google-owned CDNs, explicitly allowlisted in the CSP script-src. Same third-party-analytics tradeoff as 90003.)
#
# --- Tier 3 — instance-unique (add your own findings below) ---------------------------------------
#
2	IGNORE	(False positive: the match "10.059.003.23" is SVG <path> coordinate data in a bundled icon — context "...2.718 10.059.003.23-2.62" — not an IPv4 address (octets with leading zeros are invalid). No private IP is disclosed.)
