<!doctype html>
<html lang="%lang%">
	<head>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />

		<!-- Consent Mode v2: must execute before gtag config -->
		<!-- nonce: script-src has no 'unsafe-inline' (see kit.csp in svelte.config.js) -->
		<script nonce="%sveltekit.nonce%">
			window.dataLayer = window.dataLayer ?? []
			function gtag() {
				dataLayer.push(arguments)
			}
			const CONSENT_WAIT_MS = 500
			gtag('consent', 'default', {
				ad_storage: 'denied',
				ad_user_data: 'denied',
				ad_personalization: 'denied',
				analytics_storage: 'denied',
				wait_for_update: CONSENT_WAIT_MS,
			})
		</script>

		<!-- Google tag (gtag.js). The nonce on the external tag is what lets gtag.js copy it onto
		     the scripts it injects at runtime, so they pass the nonce-based script-src too. -->
		<script
			async
			nonce="%sveltekit.nonce%"
			src="https://www.googletagmanager.com/gtag/js?id=G-P5HFC2TERE"
		></script>
		<script nonce="%sveltekit.nonce%">
			gtag('js', new Date())
			gtag('config', 'G-P5HFC2TERE')
		</script>

		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
