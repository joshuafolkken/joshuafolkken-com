<!doctype html>
<html lang="%lang%">
	<head>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />

		<!-- Consent Mode v2: must execute before gtag config -->
		<script>
			window.dataLayer = window.dataLayer ?? []
			function gtag() {
				dataLayer.push(arguments)
			}
			const CONSENT_WAIT_MS = 500
			gtag('consent', 'default', {
				ad_storage: 'denied',
				ad_user_data: 'denied',
				ad_personalization: 'denied',
				analytics_storage: 'denied',
				wait_for_update: CONSENT_WAIT_MS,
			})
		</script>

		<!-- Google tag (gtag.js) -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-P5HFC2TERE"></script>
		<script>
			gtag('js', new Date())
			gtag('config', 'G-P5HFC2TERE')
		</script>

		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
