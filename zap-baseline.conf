# OWASP ZAP baseline rule configuration, read by `josh-app dast`.
#
# Seeded once by @joshuafolkken/app-kit, then owned by this project — `josh-app sync` never
# overwrites it, because the triage decisions below are yours.
#
# Format: one tab-separated rule per line.
#   <rule-id>	<IGNORE|WARN|FAIL>	(<reason>)
#
# Every rule defaults to WARN, and zap-baseline.py exits non-zero when anything is reported, so
# an untriaged finding fails the scan. Silence one only with a recorded reason — an IGNORE with
# no justification is indistinguishable from an unnoticed vulnerability six months later.
#
# Rule ids are printed in the scan output (e.g. `WARN-NEW: Content Security Policy (CSP) Header
# Not Set [10038]`). The full list: https://www.zaproxy.org/docs/alerts/
#
# Example:
#   10038	IGNORE	(CSP is set at the CDN edge, not by the worker — verified in production headers)

90003	IGNORE	(SRI: third-party scripts — Google Tag Manager, AdSense, Google Fonts — load from CDNs that rotate content without stable hashes, so integrity attributes would break on every upstream update; first-party assets are same-origin and served immutable. Revisit if a stably-hashed external dependency is added.)
90004	IGNORE	(COEP: Cross-Origin-Embedder-Policy require-corp would break the site's cross-origin embeds — YouTube nocookie, AdSense, OpenCollective images, Google Fonts — which do not all send CORP/CORS headers; cross-origin isolation, e.g. SharedArrayBuffer, is not used. Revisit if isolation is ever required.)
10017	IGNORE	(Cross-domain JS inclusion is intentional: Google Tag Manager and AdSense load from Google-owned CDNs, explicitly allowlisted in the CSP script-src. Same third-party-analytics tradeoff as 90003.)
10049	IGNORE	(Storable/Cacheable Content is informational and intentional: first-party assets are served immutable (Cache-Control: public, immutable) and pages are public/static with no authenticated or sensitive content to protect from caching.)
10055	IGNORE	(script-src 'unsafe-inline' is a known, accepted tradeoff for the Google Tag Manager / inline analytics bootstrap. Tightening needs nonce/hash wiring via kit.csp in svelte.config.js, tracked separately — see the CSP note in _headers. Revisit when nonce-based CSP lands.)
10109	IGNORE	(Modern Web Application is informational, not a vulnerability: ZAP only signals that the target is a client-rendered SvelteKit app, which limits passive link crawling.)
2	IGNORE	(False positive: the match "10.059.003.23" is SVG <path> coordinate data in a bundled icon — context "...2.718 10.059.003.23-2.62" — not an IPv4 address (octets with leading zeros are invalid). No private IP is disclosed.)
